name: Rebase PR + tag release

# Manually triggered workflow that keeps a long-lived PR branch (upstream PR
# candidate) rebased onto a chosen upstream ref, and produces an installable
# release tag whose tree contains the built `dist/` artifacts.
#
# Range of responsibility:
#   - rebases `inputs.branch` onto `upstream/<inputs.upstream_ref>` using
#     `git rebase --onto FETCH_HEAD upstream/main HEAD` — only commits that
#     are *not* on upstream/main get replayed, so the workflow does the right
#     thing whether the target is upstream/main itself, an older release tag
#     (e.g. `v0.37.0` while main is at v0.37.0+N), or a future release tag.
#   - runs `npm ci && npm run build && (optional) npm run test:run -- src/tests/acp-agent.test.ts`
#   - force-pushes the rebased branch *without* the dist build commit (so the
#     upstream PR stays clean)
#   - on top of the rebased HEAD, creates an in-memory `build: dist for <tag>`
#     commit and pushes only the resulting tag
#
# Note on PR diff cleanliness: GitHub's PR "Files changed" uses three-dot
# diff (`git diff base...head` = `git diff $(merge-base base head) head`),
# so the PR diff is independent of how old the branch's base is — the upstream
# PR view stays clean even when `upstream_ref` is a release tag older than
# upstream/main.
#
# Deploy on devbox:
#   sudo npm install -g git+ssh://git@github.com/LeoCui/claude-agent-acp.git#<tag>
#
# Required repo secret:
#   REBASE_PAT — fine-grained PAT scoped to this repo with Contents R/W. The
#   default GITHUB_TOKEN is not used because pushes signed by it do not
#   trigger downstream PR CI checks.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "PR branch to rebase (will be force-pushed without dist commit)"
        required: true
        default: "upstream-pr/fallback-text-from-assistant-message"
      upstream_ref:
        description: "Upstream ref to rebase onto — lock to a release tag (e.g. v0.37.0) for deploys, or use main to sync with upstream HEAD"
        required: true
        default: "v0.37.0"
      tag:
        description: "Tag to push on top of rebased branch + dist commit (e.g. v0.37.0-cuiyiming.leo95.2)"
        required: true
      run_tests:
        description: "Run acp-agent.test.ts before push"
        type: boolean
        default: true

jobs:
  rebase-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          token: ${{ secrets.REBASE_PAT }}

      - name: Configure git and add upstream remote
        run: |
          git config user.name "rebase-bot"
          git config user.email "rebase-bot@users.noreply.github.com"
          git remote add upstream https://github.com/agentclientprotocol/claude-agent-acp.git
          # Always fetch upstream/main — `rebase --onto` uses it to identify
          # which commits on the PR branch belong to the contributor (anything
          # reachable from HEAD but not from upstream/main).
          git fetch upstream main --tags
          # Then fetch the chosen target ref. When `upstream_ref` is `main`,
          # this is a no-op; otherwise FETCH_HEAD ends up pointing at the tag
          # / sha we want to rebase onto.
          git fetch upstream "${{ inputs.upstream_ref }}"

      - name: Show pre-rebase state
        run: |
          UPSTREAM_REPO="agentclientprotocol/claude-agent-acp"
          FORK_REPO="${{ github.repository }}"
          echo "=== PR branch HEAD ($FORK_REPO:${{ inputs.branch }}) ==="
          git log -3 --oneline
          echo "=== Target ref ($UPSTREAM_REPO:${{ inputs.upstream_ref }} → $(git describe --tags --always FETCH_HEAD)) ==="
          git log -3 --oneline FETCH_HEAD
          echo "=== $UPSTREAM_REPO:main (used to identify own commits) ==="
          git log -1 --oneline upstream/main
          echo "=== Own commits to replay ($UPSTREAM_REPO:main..$FORK_REPO:${{ inputs.branch }}) ==="
          git log --oneline upstream/main..HEAD || echo "(none — branch already merged into upstream)"

      - name: Rebase own commits onto target ref
        run: |
          # Take "commits in HEAD not in upstream/main" (= the contributor's
          # fix), replay them onto FETCH_HEAD (= inputs.upstream_ref). This
          # works correctly whether the target is upstream/main itself, an
          # older release tag, or a future one — upstream's own commits never
          # tag along.
          git rebase --onto FETCH_HEAD upstream/main HEAD

      - name: Show post-rebase HEAD
        run: |
          UPSTREAM_REPO="agentclientprotocol/claude-agent-acp"
          echo "=== HEAD after rebase ==="
          git log -3 --oneline
          # Use merge-base instead of HEAD~N so this stays correct regardless
          # of how many own commits the PR branch carries.
          BASE_SHA=$(git merge-base HEAD upstream/main 2>/dev/null || echo "")
          if [ -n "$BASE_SHA" ]; then
            echo "=== Real upstream base ($UPSTREAM_REPO:$(git describe --tags --always "$BASE_SHA")) ==="
            echo "  commit: $BASE_SHA"
          else
            echo "=== Real upstream base: unknown ==="
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Run acp-agent.test.ts
        if: ${{ inputs.run_tests }}
        run: npm run test:run -- src/tests/acp-agent.test.ts

      - name: Force-push clean PR branch (without dist commit)
        run: git push origin HEAD:"${{ inputs.branch }}" --force-with-lease

      - name: Create in-memory dist commit on top of rebased HEAD
        run: |
          # dist/ is .gitignore'd, force-add it for this commit
          git add -f dist
          git commit -m "build: dist for ${{ inputs.tag }}"

      - name: Create + push annotated tag
        run: |
          git tag -a "${{ inputs.tag }}" -m "Release ${{ inputs.tag }} (rebased ${{ inputs.branch }} onto ${{ inputs.upstream_ref }})"
          git push origin "${{ inputs.tag }}"

      - name: Summary
        run: |
          UPSTREAM_REPO="agentclientprotocol/claude-agent-acp"
          FORK_REPO="${{ github.repository }}"
          # Real base = merge-base with upstream/main. This works no matter how
          # many own commits the PR branch carries or how many commits the
          # workflow itself adds on top (e.g. the dist build commit).
          BASE_SHA=$(git merge-base HEAD upstream/main 2>/dev/null || echo "")
          if [ -n "$BASE_SHA" ]; then
            REAL_BASE_DESC=$(git describe --tags --always "$BASE_SHA")
            OWN_COUNT=$(git rev-list --count "$BASE_SHA..HEAD~1" 2>/dev/null || echo "?")
          else
            REAL_BASE_DESC="unknown"
            OWN_COUNT="?"
          fi
          echo "================================================================"
          echo "Tag pushed:        $FORK_REPO@${{ inputs.tag }}"
          echo "Branch updated:    $FORK_REPO:${{ inputs.branch }}  (force-pushed)"
          echo "Requested target:  $UPSTREAM_REPO:${{ inputs.upstream_ref }}  (rebased onto)"
          echo "Real rebased base: $UPSTREAM_REPO:$REAL_BASE_DESC  (commit $BASE_SHA)"
          echo "Own commits:       $OWN_COUNT  (between base and the fix commit, dist commit excluded)"
          echo ""
          echo "Deploy command on devbox:"
          echo "  sudo npm install -g git+ssh://git@github.com/$FORK_REPO.git#${{ inputs.tag }}"
          echo "================================================================"
